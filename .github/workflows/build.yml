name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache debug keystore (so updates install over earlier builds)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint (non-blocking, a heads-up only)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish rolling debug release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-build --yes --cleanup-tag || true
          gh release create debug-build app/build/outputs/apk/debug/app-debug.apk \
            --title "GaaS — Gains as a Service (debug build)" \
            --notes "Auto-built from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "GaaS-${VER}.apk"
          printf '%s\n' \
            'GaaS — Gains as a Service. Your personal macro tracker, powered by Gemini.' \
            '' \
            '## Install' \
            '' \
            "Download \`GaaS-${VER}.apk\` (the asset on this release) and open it on your phone, then enter your Gemini API key on the onboarding screen (get one free at aistudio.google.com/apikey)." \
            '' \
            '## What'\''s inside' \
            '' \
            '- Type a meal however you'\''d phrase it ("a bowl of curd rice, some pickle") and Gemini converts it to a structured breakdown: per-item calories, protein, carbs, fat, plus an assumptions note explaining what it guessed.' \
            '- Review, rephrase, or accept before it counts — nothing is logged blindly.' \
            '- Home screen shows today'\''s meals and remaining macros against your daily goal (calorie/protein/carb/fat).' \
            '- Goals and API key stored encrypted on-device; meal history persists locally via Room.' \
            '' \
            '## Notes' \
            '' \
            '- Built on \`gemini-3.5-flash-lite\` (free tier allows ~500 requests/day).' \
            '- This is a debug-signed build — fine for sideloading and personal use; not a Play Store release.' \
            > /tmp/gaas-notes.md
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" "GaaS-${VER}.apk" \
            --title "GaaS $VER" \
            --notes-file /tmp/gaas-notes.md