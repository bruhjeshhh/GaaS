name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache debug keystore (so updates install over earlier builds)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint (non-blocking, a heads-up only)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish rolling debug release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-build --yes --cleanup-tag || true
          gh release create debug-build app/build/outputs/apk/debug/app-debug.apk \
            --title "GaaS — Gains as a Service (debug build)" \
            --notes "Auto-built from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`."